name: Deploy Redis Container App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-redis-container
  cancel-in-progress: false

jobs:
  deploy-redis:
    runs-on: ubuntu-latest
    env:
      AZURE_CORE_OUTPUT: none
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
      REDIS_APP_NAME: ${{ vars.AZURE_REDIS_APP_NAME }}
      BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
      WORKER_APP_NAME: ${{ vars.AZURE_WORKER_APP_NAME }}

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or update Redis Container App
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RESOURCE_GROUP"
          test -n "$CONTAINER_ENVIRONMENT"
          test -n "$REDIS_APP_NAME"

          if az containerapp show \
            --name "$REDIS_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update \
              --name "$REDIS_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image redis:7.4-alpine \
              --min-replicas 1 \
              --max-replicas 1 \
              --command redis-server \
              --args=--appendonly yes

            az containerapp ingress enable \
              --name "$REDIS_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --type internal \
              --target-port 6379 \
              --transport tcp
          else
            az containerapp create \
              --name "$REDIS_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENVIRONMENT" \
              --image redis:7.4-alpine \
              --min-replicas 1 \
              --max-replicas 1 \
              --ingress internal \
              --target-port 6379 \
              --transport tcp \
              --command redis-server \
              --args=--appendonly yes
          fi

      - name: Wait for Redis Container App
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            state="$(az containerapp show \
              --name "$REDIS_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.runningStatus \
              --output tsv)"

            if [[ "$state" == "Running" ]]; then
              exit 0
            fi

            sleep 10
          done

          echo "Redis did not become reachable in time." >&2
          exit 1

      - name: Configure backend Redis connection
        shell: bash
        run: |
          set -euo pipefail

          if ! az containerapp show \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            printf '%s\n' 'Backend Container App todavía no existe; Redis se configurará en el primer despliegue del backend.'
            exit 0
          fi

          redis_url="redis://${REDIS_APP_NAME}:6379/0"

          az containerapp update \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              REDIS_URL="$redis_url"

          if [[ -n "$WORKER_APP_NAME" ]] && az containerapp show \
            --name "$WORKER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update \
              --name "$WORKER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                REDIS_URL="$redis_url"
          fi

      - name: Verify Redis container state
        shell: bash
        run: |
          set -euo pipefail

          state="$(az containerapp show \
            --name "$REDIS_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.runningStatus \
            --output tsv)"

          test "$state" = "Running"
