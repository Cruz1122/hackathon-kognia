services:
  chroma:
    image: chromadb/chroma:1.1.1
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && IFS= read -r status <&3 && case \"$$status\" in HTTP/*\\ 200*) exit 0;; *) exit 1;; esac'"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16.4-alpine
    container_name: hackathon-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kognia}
      POSTGRES_USER: ${POSTGRES_USER:-kognia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kognia}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: hackathon-redis
    ports:
      - "127.0.0.1:16379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hackathon-kognia-backend
    container_name: hackathon-migrate
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Always the compose network hostname. Host DATABASE_URL (localhost:15432) must not win here.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kognia}:${POSTGRES_PASSWORD:-kognia}@postgres:5432/${POSTGRES_DB:-kognia}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hackathon-kognia-backend
    container_name: hackathon-backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-test}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kognia}:${POSTGRES_PASSWORD:-kognia}@postgres:5432/${POSTGRES_DB:-kognia}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:18473}
      SHERPA_THREADS: ${SHERPA_THREADS:-2}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      CHROMA_SSL: "false"
      CHROMA_RAG_COLLECTION: rag_documents
      AGENT_TOOL_MODULES: app.domains.demo_booking.tools,app.domains.business_analytics.tools
      REDIS_URL: redis://redis:6379/0
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-60}
    ports:
      - "127.0.0.1:18474:18474"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:18474/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      chroma:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hackathon-kognia-backend
    container_name: hackathon-worker
    working_dir: /app/backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-test}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kognia}:${POSTGRES_PASSWORD:-kognia}@postgres:5432/${POSTGRES_DB:-kognia}
      REDIS_URL: redis://redis:6379/0
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-60}
      AGENT_TOOL_MODULES: app.domains.demo_booking.tools,app.domains.business_analytics.tools
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:18474}
    image: hackathon-kognia-frontend
    container_name: hackathon-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18473:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  chroma_data:
  redis_data:
