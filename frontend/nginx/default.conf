server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Use relative redirects so Docker's published host port is preserved.
    absolute_redirect off;

    # Astro emits route/index.html or route.html. Serve either at /route
    # with a 200. try_files $uri/ would 301 to a trailing slash and the
    # ClientRouter fetch fails when leaving another page.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
